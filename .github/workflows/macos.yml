name: Build macOS app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Build universal app
        run: |
          cmake -S . -B build -G Xcode '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
          cmake --build build --config Release --parallel 3
      - name: Verify and package
        run: |
          app="build/VST3Latency_artefacts/Release/VST3 Latency.app"
          exe="$app/Contents/MacOS/VST3 Latency"
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$app/Contents/Info.plist"
          icon=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIconFile" "$app/Contents/Info.plist")
          test -f "$app/Contents/Resources/$icon" || test -f "$app/Contents/Resources/$icon.icns"
          lipo "$exe" -verify_arch arm64 x86_64
          codesign --force --sign - "$app"
          codesign --verify --strict "$app"
          test_dir=$(mktemp -d)
          "$exe" --check-export "$test_dir"
          grep -Fq 'Test & XML' "$test_dir/results.txt"
          python3 -c 'import sys,zipfile,xml.etree.ElementTree as E; z=zipfile.ZipFile(sys.argv[1]); assert z.testzip() is None; [E.fromstring(z.read(n)) for n in z.namelist()]; s=z.read("xl/worksheets/sheet1.xml"); assert b"Test &amp; XML" in s and b"Fx|Delay" in s and b"<v>441</v>" in s and b"<v>882</v>" in s; ns={"m":"http://schemas.openxmlformats.org/spreadsheetml/2006/main"}; assert [len(x) for x in E.fromstring(s).findall(".//m:row", ns)] == [7,7]' "$test_dir/results.xlsx"
          ditto -c -k --keepParent "$app" VST3Latency-macOS.zip
      - uses: actions/upload-artifact@v6
        with:
          name: VST3Latency-macOS
          path: VST3Latency-macOS.zip
          if-no-files-found: error
